<body>
<script type="module">
import { createStudio } from './lib/studio.js';
const q = new URLSearchParams(location.search);
const w = +q.get('w'), h = +q.get('h'), fps = +q.get('fps') || 15;
const variant = q.get('variant') || '';
const mod = await import(`./scenes/${q.get('scene')}.js`);
const studio = createStudio({ width: w, height: h });
const update = await mod.build(studio, { variant });
window.T = mod.T;
window.frame = (i) => {
  update(((i / fps) % mod.T + mod.T) % mod.T);
  studio.render();
  return studio.renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
